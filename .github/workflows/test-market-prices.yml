name: Test market price connection

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch Iran Khodro and Saipa prices
        env:
          BARAVARD_API_KEY: ${{ secrets.BARAVARD_API_KEY }}
        run: node scripts/update-market-prices.mjs
      - name: Save test result
        uses: actions/upload-artifact@v4
        with:
          name: market-price-test
          path: daily-prices.js
          retention-days: 1
