name: Update daily market prices

on:
  workflow_dispatch:
  schedule:
    # ساعت ۱۲ ظهر ایران (UTC+3:30)
    - cron: '30 8 * * *'

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch Iran Khodro and Saipa prices
        env:
          BARAVARD_API_KEY: ${{ secrets.BARAVARD_API_KEY }}
        run: node scripts/update-market-prices.mjs
      - name: Publish changed prices
        run: |
          if git diff --quiet -- daily-prices.js; then
            echo "No price changes"
            exit 0
          fi
          git config user.name "khodrochande-price-bot"
          git config user.email "actions@users.noreply.github.com"
          git add daily-prices.js
          git commit -m "Update daily market prices"
          git push
